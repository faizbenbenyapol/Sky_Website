# เสิร์ฟไฟล์ที่ build แล้ว และเป็น proxy ไปหา Air4Thai (ใช้ใน Dockerfile)
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # ส่งต่อไป Air4Thai เพราะ Air4Thai ไม่ส่ง CORS header เบราว์เซอร์เลยเรียกตรงไม่ได้
    # ใช้ exact match (=) เปิดแค่ endpoint เดียว ไม่ให้เซิร์ฟเวอร์นี้กลายเป็น open proxy
    location = /api/air4thai/getNewAQI_JSON.php {
        proxy_pass https://air4thai.pcd.go.th/services/getNewAQI_JSON.php;
        proxy_ssl_server_name on;
        # Air4Thai ส่ง certificate chain ผิด (ใบ Let's Encrypt แต่แนบ intermediate ของ Sectigo) เปิดตรวจแล้วจะต่อไม่ได้
        # ยอมรับได้เพราะเป็นข้อมูลสาธารณะแบบอ่านอย่างเดียว ไม่มีความลับส่งออกไป
        proxy_ssl_verify off;
        proxy_set_header Host air4thai.pcd.go.th;
    }

    # แอปหน้าเดียว (SPA): path ที่ไม่มีไฟล์จริงให้ส่ง index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
